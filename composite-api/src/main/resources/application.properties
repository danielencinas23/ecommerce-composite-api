spring.application.name=composite-api
server.port=8080

# Microservicios propios
services.catalog-url=http://localhost:8081
services.inventory-url=http://localhost:8082

# API externa de divisas (principal y respaldo)
services.frankfurter-url=https://api.frankfurter.dev/v1
services.er-api-url=https://open.er-api.com/v6

# Tiempo máximo de espera por servicio
services.timeout=3s
# Antigüedad máxima de la última tasa conocida para usarla si ninguna API de divisas responde
services.rate-cache-max-age=1h
